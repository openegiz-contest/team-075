apiVersion: 1
groups:
    - orgId: 1
      name: ecomine-alerts
      folder: OpenEgiz Examples
      interval: 1m
      rules:
        - uid: bg1syzww5do1sb
          title: EcoMine | Critical Environmental Risk Alert
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: opentwins-influxdb
              model:
                intervalMs: 1000
                maxDataPoints: 43200
                query: "from(bucket: \"default\")\r\n  |> range(start: -5m)\r\n  |> filter(fn: (r) => r._measurement == \"ecomine_risk\")\r\n  |> filter(fn: (r) => r._field == \"risk_level\")\r\n  |> group(columns: [\"truck_id\"])\r\n  |> last()\r\n  |> keep(columns: [\"_time\", \"_value\", \"truck_id\"])"
                refId: A
            - refId: B
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params: []
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - B
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: last
                refId: B
                type: reduce
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1.5
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: B
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 1m
          isPaused: false
          notification_settings:
            receiver: grafana-default-email
